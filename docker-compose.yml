version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: dofren-app
    container_name: dofren_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - dofren-network

  web:
    image: nginx:alpine
    container_name: dofren_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - dofren-network

  db:
    image: mysql:8.0
    container_name: dofren_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    volumes:
      - dbdata:/var/lib/mysql
    networks:
      - dofren-network

networks:
  dofren-network:
    driver: bridge

volumes:
  dbdata:
